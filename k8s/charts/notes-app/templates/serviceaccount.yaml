{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "notes-app.labels" . | nindent 4 }}
# No IAM role annotation here. EKS Pod Identity binds this ServiceAccount to
# an IAM role from the AWS side (see infra/environments/staging), so the
# cluster holds no AWS identifiers and no credentials at all.
{{- end }}
