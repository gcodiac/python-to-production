apiVersion: v1
kind: Service
metadata:
  name: {{ include "notes-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "notes-app.labels" . | nindent 4 }}
spec:
  # ClusterIP, not NodePort or LoadBalancer: the ALB targets Pod IPs directly
  # (target-type: ip), so no node-level port is needed.
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "notes-app.selectorLabels" . | nindent 4 }}
