apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "notes-app.fullname" . }}-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "notes-app.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    # RDS stores its managed master credentials as a JSON document. jmesPath
    # extracts just the password field into its own file, so the Pod never
    # sees the username/host bundle - only the one value it needs.
    #
    # The ARN below is an identifier, not a secret: reading the secret still
    # requires the IAM permission granted through Pod Identity.
    objects: |
      - objectName: "{{ .Values.secrets.secretArn }}"
        objectType: "secretsmanager"
        jmesPath:
          - path: "{{ .Values.secrets.passwordKey }}"
            objectAlias: "{{ .Values.secrets.fileName }}"
