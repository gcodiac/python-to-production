[project]
name = "notes-app"
version = "0.1.0"
description = "A minimal Notes API built with FastAPI, SQLite locally and PostgreSQL in the cloud."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    # PostgreSQL driver for AWS staging (RDS). Local development still uses
    # SQLite from the standard library - see app/database.py.
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "bandit>=1.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# Without this, `pip install .` silently drops the dashboard's HTML/CSS/JS -
# setuptools only bundles .py files by default. Discovered while building a
# container image that runs the installed package rather than a raw source
# checkout - see container-learning/07-improving-the-dockerfile.md.
app = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
# EXE002 fires because the checked-out files happen to have their executable
# bit set - a filesystem/checkout artefact, not a code-quality issue - so it's
# excluded to keep `ruff check` output focused on real findings.
ignore = ["EXE002"]
