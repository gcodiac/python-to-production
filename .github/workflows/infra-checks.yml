name: Infra Checks

# Non-destructive validation of infrastructure code. Deliberately has NO AWS
# credentials at all: everything here is static analysis of files, so there is
# nothing to gain by giving this workflow access to a real account - see
# cloud-learning/15-github-oidc-and-kubernetes-deployment.md.

on:
  pull_request:
    branches:
      - devops/03-cicd
      - main
    paths:
      - "infra/**"
      - "k8s/**"
      - ".github/workflows/infra-checks.yml"
      - ".trivyignore.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform validate and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive infra/

      # -backend=false: validation must not need S3 access or credentials.
      - name: terraform validate (all roots)
        run: |
          for root in infra/bootstrap infra/environments/staging infra/platform/staging; do
            echo "::group::$root"
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: latest

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=error

  kubernetes:
    name: Helm lint and manifest validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: helm lint
        run: |
          helm lint k8s/charts/notes-app -f k8s/values/staging.yaml \
            --set image.repository=example.dkr.ecr.eu-west-1.amazonaws.com/notes-app \
            --set image.digest=sha256:1111111111111111111111111111111111111111111111111111111111111111 \
            --set secrets.secretArn=arn:aws:secretsmanager:eu-west-1:000000000000:secret:example \
            --set config.DB_HOST=example.rds.amazonaws.com \
            --set config.DB_USER=notes_admin

      - name: helm template (render with staging values)
        run: |
          mkdir -p .rendered
          helm template notes-app k8s/charts/notes-app -f k8s/values/staging.yaml \
            --namespace notes-app \
            --set image.repository=example.dkr.ecr.eu-west-1.amazonaws.com/notes-app \
            --set image.digest=sha256:1111111111111111111111111111111111111111111111111111111111111111 \
            --set secrets.secretArn=arn:aws:secretsmanager:eu-west-1:000000000000:secret:example \
            --set config.DB_HOST=example.rds.amazonaws.com \
            --set config.DB_USER=notes_admin \
            > .rendered/notes-app.yaml
          cat .rendered/notes-app.yaml

      # Validates the rendered objects against real Kubernetes API schemas -
      # catches typos and wrong field names that `helm lint` cannot see.
      - name: kubeconform
        run: |
          curl -fsSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          # SecretProviderClass is a CRD, so its schema is not in the standard
          # Kubernetes catalogue - skipped rather than ignoring all errors.
          ./kubeconform -strict -summary \
            -kubernetes-version 1.36.0 \
            -skip SecretProviderClass \
            .rendered/notes-app.yaml

  iac-security:
    name: Trivy IaC scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      # Scanned as rendered manifests, not raw templates: Trivy cannot
      # evaluate Helm templating, so this checks what would actually be applied.
      - name: Render manifests for scanning
        run: |
          mkdir -p .rendered
          helm template notes-app k8s/charts/notes-app -f k8s/values/staging.yaml \
            --namespace notes-app \
            --set image.repository=example.dkr.ecr.eu-west-1.amazonaws.com/notes-app \
            --set image.digest=sha256:1111111111111111111111111111111111111111111111111111111111111111 \
            --set secrets.secretArn=arn:aws:secretsmanager:eu-west-1:000000000000:secret:example \
            --set config.DB_HOST=example.rds.amazonaws.com \
            --set config.DB_USER=notes_admin \
            > .rendered/notes-app.yaml

      # Blocks on HIGH/CRITICAL. Accepted findings live in .trivyignore.yaml
      # with a written justification each - never a blanket suppression.
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml
